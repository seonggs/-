<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>민원서비스 검색</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <p class="eyebrow">민원서비스 안내</p>
      <h1>원하는 민원서비스를 빠르게 찾아보세요</h1>
      <p class="intro">서비스명으로 검색하거나 민원분야를 선택해 필요한 서비스를 확인할 수 있습니다.</p>
    </div>
  </header>

  <main class="wrap">
    <section class="search-panel" aria-label="민원서비스 검색 및 필터">
      <div class="control">
        <label for="keyword">서비스명 검색</label>
        <input id="keyword" type="search" placeholder="예: 여권, 주민등록, 건축" autocomplete="off">
      </div>
      <div class="control">
        <label for="category">민원분야</label>
        <select id="category">
          <option value="">전체 분야</option>
        </select>
      </div>
      <button id="resetBtn" type="button">검색 초기화</button>
    </section>

    <section class="result-head">
      <h2>민원서비스 목록</h2>
      <p id="resultCount" aria-live="polite">총 22건 중 22건 표시</p>
    </section>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>서비스명</th>
            <th>소관기관</th>
            <th>민원분야</th>
            <th>온라인처리</th>
            <th>처리기한</th>
            <th>수수료</th>
          </tr>
        </thead>
        <tbody id="serviceBody"></tbody>
      </table>
    </div>

    <div id="cardList" class="card-list" aria-label="민원서비스 카드 목록"></div>
    <p id="emptyMessage" class="empty" hidden>검색 조건에 맞는 민원서비스가 없습니다.</p>
  </main>

  <footer>
    <div class="wrap">민원서비스 검색 · 총 22개 서비스</div>
  </footer>
  <script src="app.js"></script>
</body>
</html>
